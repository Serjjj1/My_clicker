<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Майнинг кликер</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .screen.active {
            display: flex;
        }

        #mainScreen {
            justify-content: center;
        }

        .score-display {
            font-size: 48px;
            font-weight: 900;
            color: #ffeedd;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #5c2e0e, 4px 4px 0 rgba(0,0,0,0.3), 0 0 15px rgba(255,215,0,0.5);
            background: transparent;
            padding: 10px 20px;
        }

        .cookie-image {
            width: 75%;
            max-width: 300px;
            cursor: pointer;
            transition: transform 0.05s linear;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
            display: block;
            user-select: none;
        }

        .cookie-image:active {
            transform: scale(0.97);
        }

        .energy-bar-container {
            width: 85%;
            max-width: 350px;
            height: 30px;
            background-color: rgba(60, 60, 80, 0.7);
            border-radius: 30px;
            margin: 20px auto 10px auto;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.5);
        }

        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ffd966, #ffaa33);
            border-radius: 30px;
            transition: width 0.2s ease-out;
        }

        .energy-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 0 #333;
        }

        .shop-tabs {
            display: flex;
            width: 100%;
            gap: 8px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px;
        }

        .shop-tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            background: rgba(255,245,215,0.5);
            border-radius: 35px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .shop-tab.active {
            background: rgba(255, 200, 50, 0.85);
            color: #5c2e0e;
            box-shadow: 0 0 10px gold;
        }

        .upgrades-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upgrade-item {
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #ffd966;
            cursor: pointer;
            transition: 0.1s;
            position: relative;
        }

        .upgrade-item:active {
            transform: scale(0.98);
        }

        .upgrade-item.affordable {
            border-left-color: #00ff00;
        }

        .upgrade-item.not-affordable {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .upgrade-info {
            flex: 2;
        }

        .upgrade-name {
            font-weight: bold;
            color: #ffd966;
            font-size: 16px;
        }

        .upgrade-desc {
            font-size: 12px;
            color: #ccc;
        }

        .upgrade-stats {
            flex: 1;
            text-align: right;
        }

        .upgrade-price {
            background: #ffaa33;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            color: #2c1a0e;
            font-size: 14px;
            display: inline-block;
        }

        .upgrade-level {
            font-size: 11px;
            color: #ffd966;
            margin-top: 4px;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255, 200, 50, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 20px;
            border-radius: 35px 35px 0 0;
            flex-shrink: 0;
            border-top: 2px solid rgba(255, 230, 100, 0.9);
            overflow-x: auto;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: white;
            padding: 8px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
            text-align: center;
            white-space: nowrap;
        }

        .nav-btn.active {
            background: #ffd966;
            color: #8b4513;
        }

        audio { display: none; }
        
        .coming-soon { 
            text-align: center; 
            background: rgba(0,0,0,0.6); 
            padding: 30px; 
            border-radius: 40px; 
            color: white; 
        }

        .insufficient-funds {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 100, 100, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            animation: slideUp 0.3s ease-out;
            z-index: 999;
        }

        @keyframes slideUp {
            from {
                bottom: 0;
                opacity: 0;
            }
            to {
                bottom: 80px;
                opacity: 1;
            }
        }

        .logs-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 10px;
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #0f0;
        }

        .log-entry {
            margin: 4px 0;
            padding: 4px 8px;
            border-radius: 4px;
            word-break: break-all;
        }

        .log-entry.info {
            color: #0f0;
            background: rgba(0, 255, 0, 0.05);
        }

        .log-entry.error {
            color: #f00;
            background: rgba(255, 0, 0, 0.05);
        }

        .log-entry.warning {
            color: #ff0;
            background: rgba(255, 255, 0, 0.05);
        }

        .log-entry.debug {
            color: #0ff;
            background: rgba(0, 255, 255, 0.05);
        }

        .log-controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
        }

        .log-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255, 200, 50, 0.85);
            color: #5c2e0e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .log-btn:active {
            transform: scale(0.98);
        }

        .status-banner {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 1000;
            max-width: 200px;
            text-align: right;
            border-left: 4px solid #0f0;
        }

        .status-banner.error {
            border-left-color: #f00;
        }

        .status-banner.pending {
            border-left-color: #ff0;
        }
    </style>
</head>
<body>

<div id="mainScreen" class="screen active">
    <div class="score-display" id="score">0</div>
    <img src="cookie.png" alt="Процессор" class="cookie-image" id="cookieImg" onclick="GameManager.clickChip(event)">
    <div class="energy-bar-container">
        <div class="energy-bar-fill" id="energyFill"></div>
        <div class="energy-text" id="energyText">0 / 500</div>
    </div>
</div>

<div id="shopScreen" class="screen">
    <div class="shop-tabs">
        <div class="shop-tab active" data-tab="power">💪 Мощность</div>
        <div class="shop-tab" data-tab="mining">⛏️ Майнинг</div>
        <div class="shop-tab" data-tab="energy">⚡ Выносливость</div>
    </div>
    <div id="powerUpgrades" class="upgrades-list"></div>
    <div id="miningUpgrades" class="upgrades-list" style="display:none;"></div>
    <div id="energyUpgrades" class="upgrades-list" style="display:none;"></div>
</div>

<div id="ratingScreen" class="screen">
    <div class="coming-soon">🏆 Рейтинг<br><span style="font-size:16px;">В разработке</span></div>
</div>

<div id="logsScreen" class="screen">
    <div class="logs-container" id="logsContainer"></div>
    <div class="log-controls">
        <button class="log-btn" onclick="GameManager.clearLogs()">🗑️ Очистить</button>
        <button class="log-btn" onclick="GameManager.exportLogs()">📥 Экспорт</button>
    </div>
</div>

<div class="navbar">
    <button class="nav-btn active" data-screen="main">🏠 Главная</button>
    <button class="nav-btn" data-screen="shop">🛒 Магазин</button>
    <button class="nav-btn" data-screen="rating">🏆 Рейтинг</button>
    <button class="nav-btn" data-screen="logs">📋 Логи</button>
</div>

<div id="statusBanner" class="status-banner">✅ Готово</div>

<audio id="clickSound0" preload="auto"><source src="clicking.wav" type="audio/wav"></audio>
<audio id="clickSound1" preload="auto"><source src="clicking.wav" type="audio/wav"></audio>
<audio id="clickSound2" preload="auto"><source src="clicking.wav" type="audio/wav"></audio>
<audio id="clickSound3" preload="auto"><source src="clicking.wav" type="audio/wav"></audio>
<audio id="clickSound4" preload="auto"><source src="clicking.wav" type="audio/wav"></audio>

<script>
    const UPGRADES = {
        power: [
            { baseCost: 0.5, basePower: 0.001, multiplier: 1.4, name: "Младший транзистор", desc: "+0.001 силы" },
            { baseCost: 2, basePower: 0.005, multiplier: 1.4, name: "Логический элемент", desc: "+0.005 силы" },
            { baseCost: 10, basePower: 0.3, multiplier: 1.5, name: "Интегральная схема", desc: "+0.3 силы" },
            { baseCost: 25, basePower: 0.8, multiplier: 1.5, name: "Тактовый генератор", desc: "+0.8 силы" },
            { baseCost: 100, basePower: 3.5, multiplier: 1.6, name: "Кремниевая пластина", desc: "+3.5 силы" }
        ],
        mining: [
            { baseCost: 1, baseIncome: 0.001, multiplier: 1.5, name: "Ферма из GPU", desc: "+0.001/сек" },
            { baseCost: 17, baseIncome: 0.02, multiplier: 1.5, name: "ASIC-майнер", desc: "+0.02/сек" },
            { baseCost: 50, baseIncome: 0.06, multiplier: 1.6, name: "Майнинг-пул", desc: "+0.06/сек" },
            { baseCost: 120, baseIncome: 0.15, multiplier: 1.7, name: "ЦОД", desc: "+0.15/сек" },
            { baseCost: 250, baseIncome: 0.35, multiplier: 1.7, name: "Квантовый чип", desc: "+0.35/сек" }
        ],
        energy: [
            { baseCost: 10, baseRegen: 1, multiplier: 3, name: "Турбо-кулер", desc: "+1 реген/сек", type: "regen" },
            { baseCost: 20, baseMax: 500, multiplier: 3, name: "ИБП", desc: "+500 к макс. энергии", type: "max" }
        ]
    };

    const CONFIG = {
        BASE_MAX_ENERGY: 500,
        BASE_ENERGY_REGEN: 5,
        SAVE_INTERVAL: 1000
    };

    const GameManager = {
        state: {
            score: 0,
            powerLevels: [0,0,0,0,0],
            miningLevels: [0,0,0,0,0],
            energyLevels: [0,0],
            currentEnergy: CONFIG.BASE_MAX_ENERGY
        },

        stats: {
            currentPower: 0.001,
            currentIncome: 0,
            maxEnergy: CONFIG.BASE_MAX_ENERGY,
            energyRegen: CONFIG.BASE_ENERGY_REGEN
        },

        webApp: null,
        isInTelegram: false,
        userId: null,
        lastSaveTime: 0,
        soundIndex: 0,
        loadTimeout: null,
        logs: [],

        // ========================================
        // ЛОГИРОВАНИЕ
        // ========================================
        log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            
            this.logs.push({ message: logMessage, type });
            console.log(`[${type.toUpperCase()}]`, message);
            this.renderLogs();
        },

        renderLogs() {
            const container = document.getElementById('logsContainer');
            if (!container) return;

            container.innerHTML = '';
            const fragment = document.createDocumentFragment();

            // Показываем последние 100 логов
            const recentLogs = this.logs.slice(-100);

            for (const log of recentLogs) {
                const div = document.createElement('div');
                div.className = `log-entry ${log.type}`;
                div.textContent = log.message;
                fragment.appendChild(div);
            }

            container.appendChild(fragment);
            // Скроллим вниз
            container.scrollTop = container.scrollHeight;
        },

        clearLogs() {
            this.logs = [];
            this.renderLogs();
            this.log('Логи очищены', 'info');
        },

        exportLogs() {
            const text = this.logs.map(l => l.message).join('\n');
            const element = document.createElement("a");
            element.setAttribute("href", "data:text/plain;charset=utf-8," + encodeURIComponent(text));
            element.setAttribute("download", "game_logs.txt");
            element.style.display = "none";
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
            this.log('Логи экспортированы', 'info');
        },

        // ========================================
        // ИНИЦИАЛИЗАЦИЯ
        // ========================================
        init() {
            this.log('=== ЗАПУСК ИГРЫ ===', 'debug');
            this.log('Загрузка из localStorage...', 'info');
            
            this.loadFromLocalStorageSync();
            this.initTelegramAsync();
            
            this.recalcStats();
            this.updateUI();
            this.renderShop();
            this.setupEventListeners();
            this.startAutoSave();
            this.startPassiveIncome();
            
            this.log('✅ Готово', 'info');
            this.updateStatus("✅ Готово");
        },

        // ========================================
        // СИНХРОННАЯ ЗАГРУЗКА
        // ========================================
        loadFromLocalStorageSync() {
            const storageKey = "mining_game_data";

            try {
                const saved = localStorage.getItem(storageKey);
                
                if (saved) {
                    const data = JSON.parse(saved);
                    this.log(`✅ localStorage загружено (score: ${data.score})`, 'info');
                    this.applyLoadedData(data);
                } else {
                    this.log('Нет данных в localStorage, новая игра', 'info');
                    this.startNewGame();
                }
            } catch (e) {
                this.log(`❌ localStorage ошибка: ${e.message}`, 'error');
                this.startNewGame();
            }
        },

        // ========================================
        // TELEGRAM ИНИЦИАЛИЗАЦИЯ
        // ========================================
        initTelegramAsync() {
            setTimeout(() => {
                this.initTelegram();
            }, 0);
        },

        initTelegram() {
            try {
                this.webApp = window.Telegram?.WebApp;
                
                if (this.webApp) {
                    this.webApp.ready();
                    this.webApp.expand();
                    
                    const initData = this.webApp.initDataUnsafe;
                    this.log(`Telegram initData: ${JSON.stringify(initData)}`, 'debug');
                    
                    if (initData && initData.user) {
                        this.userId = initData.user.id;
                        this.log(`✅ Telegram User ID: ${this.userId}`, 'info');
                        this.isInTelegram = true;
                        this.loadFromTelegramWithTimeout();
                    } else {
                        this.log('⚠️ Telegram: нет user ID', 'warning');
                    }
                } else {
                    this.log('ℹ️ Telegram не доступен (браузер)', 'info');
                }
            } catch (e) {
                this.log(`❌ Telegram init ошибка: ${e.message}`, 'error');
            }
        },

        // ========================================
        // ЗАГРУЗКА ИЗ TELEGRAM
        // ========================================
        loadFromTelegramWithTimeout() {
            if (!this.isInTelegram || !this.userId) return;

            const key = `mining_${this.userId}`;
            this.log(`Запрос Telegram CloudStorage ключ: ${key}`, 'debug');
            
            this.updateStatus("⏳ Синхронизация...", "pending");

            this.loadTimeout = setTimeout(() => {
                this.log('⏱️ Telegram таймаут (5 сек)', 'warning');
                this.updateStatus("⚠️ Telegram медленный", "error");
            }, 5000);

            this.webApp.CloudStorage.getItem(key, (error, value) => {
                if (this.loadTimeout) {
                    clearTimeout(this.loadTimeout);
                    this.loadTimeout = null;
                }

                if (error) {
                    this.log(`❌ Telegram getItem ошибка: ${error}`, 'error');
                    this.updateStatus("⚠️ TG ошибка", "error");
                    return;
                }

                if (!value) {
                    this.log('Telegram CloudStorage пуст, сохраняю текущее состояние', 'info');
                    this.updateStatus("💾 Сохраняю...", "pending");
                    this.saveTelegram();
                    return;
                }

                try {
                    const data = JSON.parse(value);
                    this.log(`✅ Telegram загружено (score: ${data.score})`, 'info');
                    this.applyLoadedData(data);
                    this.recalcStats();
                    this.updateUI();
                    this.renderShop();
                    this.updateStatus("✅ Синхронизировано");
                } catch (e) {
                    this.log(`❌ Telegram JSON ошибка: ${e.message}`, 'error');
                }
            });
        },

        // ========================================
        // СОХРАНЕНИЕ
        // ========================================
        saveGame() {
            const now = Date.now();
            if (now - this.lastSaveTime < 500) {
                return;
            }
            this.lastSaveTime = now;

            const gameData = JSON.stringify(this.state);
            
            try {
                localStorage.setItem("mining_game_data", gameData);
                this.log(`💾 localStorage сохранено (score: ${this.state.score})`, 'debug');
            } catch (e) {
                this.log(`❌ localStorage save ошибка: ${e.message}`, 'error');
            }

            if (this.isInTelegram && this.userId && this.webApp?.CloudStorage) {
                this.saveTelegram(gameData);
            }
        },

        saveTelegram(gameData = null) {
            const key = `mining_${this.userId}`;
            const data = gameData || JSON.stringify(this.state);
            
            try {
                this.webApp.CloudStorage.setItem(key, data, (error) => {
                    if (error) {
                        this.log(`❌ Telegram save ошибка: ${error}`, 'error');
                    } else {
                        this.log(`✅ Telegram сохранено (score: ${this.state.score})`, 'debug');
                    }
                });
            } catch (e) {
                this.log(`❌ Telegram save exception: ${e.message}`, 'error');
            }
        },

        // ========================================
        // ПРОЧИЕ МЕТОДЫ
        // ========================================
        applyLoadedData(data) {
            this.state.score = data.score ?? 0;
            this.state.powerLevels = data.powerLevels ?? [0,0,0,0,0];
            this.state.miningLevels = data.miningLevels ?? [0,0,0,0,0];
            this.state.energyLevels = data.energyLevels ?? [0,0];
            this.state.currentEnergy = data.currentEnergy ?? CONFIG.BASE_MAX_ENERGY;
        },

        startNewGame() {
            this.state = {
                score: 0,
                powerLevels: [0,0,0,0,0],
                miningLevels: [0,0,0,0,0],
                energyLevels: [0,0],
                currentEnergy: CONFIG.BASE_MAX_ENERGY
            };
            this.log('🌟 Новая игра', 'info');
        },

        recalcStats() {
            let powerBonus = 0;
            for (let i = 0; i < this.state.powerLevels.length; i++) {
                powerBonus += this.state.powerLevels[i] * UPGRADES.power[i].basePower;
            }
            this.stats.currentPower = 0.001 + powerBonus;

            let incomeBonus = 0;
            for (let i = 0; i < this.state.miningLevels.length; i++) {
                incomeBonus += this.state.miningLevels[i] * UPGRADES.mining[i].baseIncome;
            }
            this.stats.currentIncome = incomeBonus;

            this.stats.maxEnergy = CONFIG.BASE_MAX_ENERGY + 
                (this.state.energyLevels[1] * UPGRADES.energy[1].baseMax);

            this.stats.energyRegen = CONFIG.BASE_ENERGY_REGEN + 
                (this.state.energyLevels[0] * UPGRADES.energy[0].baseRegen);

            if (this.state.currentEnergy > this.stats.maxEnergy) {
                this.state.currentEnergy = this.stats.maxEnergy;
            }
        },

        updateUI() {
            const scoreElem = document.getElementById('score');
            if (scoreElem) scoreElem.innerText = this.state.score.toFixed(4);

            const percent = (this.state.currentEnergy / this.stats.maxEnergy) * 100;
            const fillElem = document.getElementById('energyFill');
            if (fillElem) fillElem.style.width = Math.min(100, percent) + '%';

            const textElem = document.getElementById('energyText');
            if (textElem) {
                textElem.innerText = Math.floor(this.state.currentEnergy) + ' / ' + Math.floor(this.stats.maxEnergy);
            }
        },

        renderShop() {
            this.renderUpgradeCategory('power', UPGRADES.power, this.state.powerLevels, 'powerUpgrades');
            this.renderUpgradeCategory('mining', UPGRADES.mining, this.state.miningLevels, 'miningUpgrades');
            this.renderUpgradeCategory('energy', UPGRADES.energy, this.state.energyLevels, 'energyUpgrades');
        },

        renderUpgradeCategory(type, upgrades, levels, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = '';
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < upgrades.length; i++) {
                const upgrade = upgrades[i];
                const level = levels[i];
                const cost = upgrade.baseCost * Math.pow(upgrade.multiplier, level);
                const canAfford = this.state.score >= cost;

                const nextBonus = upgrade.basePower || upgrade.baseIncome || 
                                (upgrade.type === 'regen' ? upgrade.baseRegen : upgrade.baseMax);
                const bonusText = this.getBonusText(upgrade, nextBonus);

                const elem = document.createElement('div');
                elem.className = `upgrade-item ${canAfford ? 'affordable' : 'not-affordable'}`;
                elem.onclick = () => this.buyUpgrade(type, i);

                elem.innerHTML = `
                    <div class="upgrade-info">
                        <div class="upgrade-name">${upgrade.name} lv.${level}</div>
                        <div class="upgrade-desc">${upgrade.desc}</div>
                    </div>
                    <div class="upgrade-stats">
                        <div class="upgrade-price">💰 ${cost.toFixed(2)}</div>
                        <div class="upgrade-level">${bonusText}</div>
                    </div>
                `;

                fragment.appendChild(elem);
            }

            container.appendChild(fragment);
        },

        getBonusText(upgrade, bonus) {
            if (upgrade.basePower) return `+${bonus.toFixed(4)} силы`;
            if (upgrade.baseIncome) return `+${bonus.toFixed(4)}/сек`;
            if (upgrade.type === 'regen') return `+${bonus.toFixed(1)}/сек`;
            if (upgrade.type === 'max') return `+${bonus} макс`;
            return '';
        },

        buyUpgrade(type, idx) {
            const upgradeList = UPGRADES[type];
            const levelsList = this.state[type + 'Levels'];

            if (!upgradeList || !levelsList) return;

            const upgrade = upgradeList[idx];
            const level = levelsList[idx];
            const cost = upgrade.baseCost * Math.pow(upgrade.multiplier, level);

            if (this.state.score >= cost) {
                this.state.score -= cost;
                levelsList[idx]++;
                
                this.log(`🛍️ Куплено: ${upgrade.name} (уровень ${level + 1})`, 'info');
                
                this.recalcStats();
                this.saveGame();
                this.updateUI();
                this.renderShop();
                
                this.vibrate(50);
                this.playClickSound();
            } else {
                this.showInsufficientFunds(cost - this.state.score);
                this.vibrate(100);
            }
        },

        showInsufficientFunds(needed) {
            const elem = document.createElement('div');
            elem.className = 'insufficient-funds';
            elem.innerText = `Нужно ещё ${needed.toFixed(2)} 💰`;
            document.body.appendChild(elem);
            
            setTimeout(() => elem.remove(), 2000);
        },

        clickChip(event) {
            if (this.state.currentEnergy < 1) {
                this.vibrate(50);
                return;
            }

            this.state.currentEnergy -= 1;
            this.state.score += this.stats.currentPower;
            
            this.saveGame();
            this.vibrate(15);
            this.playClickSound();
            this.animateClick();
            this.showFloatingText(event);
            this.updateUI();
        },

        animateClick() {
            const img = document.getElementById('cookieImg');
            if (!img) return;

            img.style.transform = 'scale(0.97)';
            setTimeout(() => {
                img.style.transform = '';
            }, 80);
        },

        showFloatingText(event) {
            const text = document.createElement('div');
            text.innerText = '+' + this.stats.currentPower.toFixed(4);
            text.style.position = 'fixed';
            text.style.fontSize = '20px';
            text.style.fontWeight = 'bold';
            text.style.color = '#ffaa33';
            text.style.textShadow = '1px 1px 0 #8b4513';
            text.style.pointerEvents = 'none';
            text.style.zIndex = '1000';
            text.style.userSelect = 'none';

            const x = event.touches ? event.touches[0].clientX : event.clientX;
            const y = event.touches ? event.touches[0].clientY : event.clientY;
            
            text.style.left = (x - 20) + 'px';
            text.style.top = (y - 30) + 'px';

            document.body.appendChild(text);
            
            setTimeout(() => text.remove(), 500);
        },

        playClickSound() {
            try {
                const elem = document.getElementById('clickSound' + this.soundIndex);
                if (elem) {
                    elem.pause();
                    elem.currentTime = 0;
                    elem.play().catch(() => {});
                }
                this.soundIndex = (this.soundIndex + 1) % 5;
            } catch (e) {}
        },

        vibrate(duration) {
            if (navigator.vibrate) {
                navigator.vibrate(duration);
            }
        },

        showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id + 'Screen');
            if (target) target.classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector(`.nav-btn[data-screen="${id}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            if (id === 'shop') {
                this.renderShop();
            } else if (id === 'logs') {
                this.renderLogs();
            }
        },

        switchShopTab(tabName) {
            document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.querySelector(`.shop-tab[data-tab="${tabName}"]`);
            if (activeTab) activeTab.classList.add('active');

            const containers = {
                'power': 'powerUpgrades',
                'mining': 'miningUpgrades',
                'energy': 'energyUpgrades'
            };

            Object.values(containers).forEach(id => {
                const elem = document.getElementById(id);
                if (elem) elem.style.display = 'none';
            });

            const activeContainer = document.getElementById(containers[tabName]);
            if (activeContainer) activeContainer.style.display = 'flex';
        },

        startAutoSave() {
            setInterval(() => {
                this.saveGame();
            }, CONFIG.SAVE_INTERVAL);
        },

        startPassiveIncome() {
            setInterval(() => {
                if (this.state.currentEnergy < this.stats.maxEnergy) {
                    this.state.currentEnergy = Math.min(
                        this.state.currentEnergy + this.stats.energyRegen,
                        this.stats.maxEnergy
                    );
                }

                this.state.score += this.stats.currentIncome;
                this.updateUI();
            }, 1000);
        },

        setupEventListeners() {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const screenId = btn.getAttribute('data-screen');
                    this.showScreen(screenId);
                });
            });

            document.querySelectorAll('.shop-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabName = this.getAttribute('data-tab');
                    GameManager.switchShopTab(tabName);
                });
            });

            document.addEventListener('click', () => {
                document.querySelectorAll('audio').forEach(audio => {
                    audio.play().catch(() => {});
                });
            }, { once: true });
        },

        updateStatus(message, status = "ok") {
            const banner = document.getElementById('statusBanner');
            if (!banner) return;

            banner.textContent = message;
            banner.className = 'status-banner';
            
            if (status === "error") {
                banner.classList.add('error');
            } else if (status === "pending") {
                banner.classList.add('pending');
            }
        }
    };

    // ========================================
    // ЗАПУСК
    // ========================================
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            GameManager.init();
        });
    } else {
        GameManager.init();
    }

</script>
</body>
</html>
